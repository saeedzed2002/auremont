name: Checks

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine3.24
        env:
          POSTGRES_DB: auremont
          POSTGRES_USER: auremont
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -U auremont -d auremont"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    env:
      DJANGO_SECRET_KEY: ci-only-secret-key-with-ample-length-and-unique-characters-2026
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      DJANGO_CSRF_TRUSTED_ORIGINS: https://auremont.example
      DJANGO_SECURE_HSTS_INCLUDE_SUBDOMAINS: "true"
      DJANGO_SECURE_HSTS_PRELOAD: "true"
      DATABASE_URL: postgresql://auremont:postgres@127.0.0.1:5432/auremont
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14.7"
          cache: pip
      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt
      - name: Check formatting
        run: ruff format --check .
      - name: Lint
        run: ruff check .
      - name: Run Django checks and tests
        run: python manage.py check && python manage.py test
      - name: Validate production configuration
        run: python manage.py check --deploy --settings=config.settings.production
