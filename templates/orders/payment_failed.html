{% extends "base.html" %}

{% block title %}Payment not completed — Auremont{% endblock %}

{% block content %}
  <section class="mx-auto max-w-xl px-5 py-16 sm:px-8 lg:py-24">
    <p class="text-[0.65rem] font-semibold uppercase tracking-[0.24em] text-brass">Demo payment</p>
    <h1 class="mt-4 font-display text-5xl tracking-[-0.035em] text-charcoal">Payment not completed.</h1>
    <p class="mt-5 text-base leading-7 text-graphite">The simulated payment failed. Your cart and current stock reservation have not been changed.</p>
    <div class="mt-9 flex flex-wrap gap-4">
      <a class="rounded-sm bg-charcoal px-5 py-3 text-xs font-semibold uppercase tracking-[0.18em] text-ivory transition-colors hover:bg-graphite focus:outline-2 focus:outline-offset-4 focus:outline-brass" href="{% url 'orders:mock_payment' %}">Try demo payment again</a>
      <a class="rounded-sm border border-charcoal/25 px-5 py-3 text-xs font-semibold uppercase tracking-[0.16em] text-charcoal transition-colors hover:border-charcoal focus:outline-2 focus:outline-offset-4 focus:outline-brass" href="{% url 'cart:detail' %}">Return to cart</a>
    </div>
  </section>
{% endblock %}
