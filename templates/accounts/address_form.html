{% extends "base.html" %}

{% block title %}{{ heading }} — Auremont{% endblock %}

{% block content %}
  <section class="mx-auto max-w-2xl px-5 py-16 sm:px-8 lg:py-24">
    <p class="text-[0.65rem] font-semibold uppercase tracking-[0.24em] text-brass">Delivery details</p>
    <h1 class="mt-4 font-display text-5xl tracking-[-0.035em] text-charcoal">{{ heading }}.</h1>
    <form class="account-form mt-9 space-y-5 border border-charcoal/15 bg-stone/45 p-6 sm:p-9" method="post">
      {% csrf_token %}
      {{ form.non_field_errors }}
      {% include "components/form_fields.html" with form=form %}
      <div class="flex flex-wrap gap-4 pt-2">
        <button class="rounded-sm bg-charcoal px-5 py-3 text-xs font-semibold uppercase tracking-[0.18em] text-ivory transition-colors hover:bg-graphite focus:outline-2 focus:outline-offset-4 focus:outline-brass" type="submit">Save address</button>
        <a class="rounded-sm border border-charcoal/25 px-5 py-3 text-xs font-semibold uppercase tracking-[0.16em] text-charcoal transition-colors hover:border-charcoal focus:outline-2 focus:outline-offset-4 focus:outline-brass" href="{% url 'accounts:address_list' %}">Cancel</a>
      </div>
    </form>
  </section>
{% endblock %}
