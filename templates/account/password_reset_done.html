{% extends "base.html" %}

{% block title %}Check your email — Auremont{% endblock %}

{% block content %}
  <section class="mx-auto max-w-xl px-5 py-16 sm:px-8 lg:py-24">
    <p class="text-[0.65rem] font-semibold uppercase tracking-[0.24em] text-brass">Account recovery</p>
    <h1 class="mt-4 font-display text-5xl tracking-[-0.035em] text-charcoal">Check your email.</h1>
    <p class="mt-5 text-base leading-7 text-graphite">If an account matches the address, a password reset link is on its way.</p>
    <a class="mt-9 inline-flex rounded-sm border border-charcoal/25 px-5 py-3 text-xs font-semibold uppercase tracking-[0.16em] text-charcoal transition-colors hover:border-charcoal focus:outline-2 focus:outline-offset-4 focus:outline-brass" href="{% url 'account_login' %}">Return to sign in</a>
  </section>
{% endblock %}
