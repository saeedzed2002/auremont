{% extends "base.html" %}

{% block title %}Password updated — Auremont{% endblock %}

{% block content %}
  <section class="mx-auto max-w-xl px-5 py-16 sm:px-8 lg:py-24">
    <p class="text-[0.65rem] font-semibold uppercase tracking-[0.24em] text-brass">Account recovery</p>
    <h1 class="mt-4 font-display text-5xl tracking-[-0.035em] text-charcoal">Password updated.</h1>
    <p class="mt-5 text-base leading-7 text-graphite">Your account is ready to use with the new password.</p>
    <a class="mt-9 inline-flex rounded-sm bg-charcoal px-5 py-3 text-xs font-semibold uppercase tracking-[0.18em] text-ivory transition-colors hover:bg-graphite focus:outline-2 focus:outline-offset-4 focus:outline-brass" href="{% url 'account_login' %}">Sign in</a>
  </section>
{% endblock %}
