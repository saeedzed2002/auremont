{% if messages %}
  <div class="mx-auto max-w-7xl px-5 pt-5 sm:px-8 lg:px-10" aria-live="polite">
    {% for message in messages %}
      <div class="border border-brass/45 bg-stone px-4 py-3 text-sm text-charcoal"{% if message.tags %} data-message-level="{{ message.tags }}"{% endif %}>{{ message }}</div>
    {% endfor %}
  </div>
{% endif %}
