x-django-service: &django-service
  build:
    context: .
    dockerfile: Dockerfile
  environment:
    DJANGO_SETTINGS_MODULE: config.settings.production
    DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env.production}
    DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:?Set DJANGO_ALLOWED_HOSTS in .env.production}
    DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:?Set DJANGO_CSRF_TRUSTED_ORIGINS in .env.production}
    DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:?Set DEFAULT_FROM_EMAIL in .env.production}
    SERVER_EMAIL: ${SERVER_EMAIL:?Set SERVER_EMAIL in .env.production}
    DJANGO_EMAIL_BACKEND: ${DJANGO_EMAIL_BACKEND:-django.core.mail.backends.smtp.EmailBackend}
    DJANGO_EMAIL_HOST: ${DJANGO_EMAIL_HOST:?Set DJANGO_EMAIL_HOST in .env.production}
    DJANGO_EMAIL_PORT: ${DJANGO_EMAIL_PORT:-587}
    DJANGO_EMAIL_HOST_USER: ${DJANGO_EMAIL_HOST_USER:?Set DJANGO_EMAIL_HOST_USER in .env.production}
    DJANGO_EMAIL_HOST_PASSWORD: ${DJANGO_EMAIL_HOST_PASSWORD:?Set DJANGO_EMAIL_HOST_PASSWORD in .env.production}
    DJANGO_EMAIL_USE_TLS: ${DJANGO_EMAIL_USE_TLS:-true}
    GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
    GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
    DJANGO_SECURE_SSL_REDIRECT: ${DJANGO_SECURE_SSL_REDIRECT:-true}
    DJANGO_SECURE_HSTS_SECONDS: ${DJANGO_SECURE_HSTS_SECONDS:-31536000}
    DJANGO_SECURE_HSTS_INCLUDE_SUBDOMAINS: ${DJANGO_SECURE_HSTS_INCLUDE_SUBDOMAINS:-false}
    DJANGO_SECURE_HSTS_PRELOAD: ${DJANGO_SECURE_HSTS_PRELOAD:-false}
  volumes:
    - auremont_static_data:/app/staticfiles
    - auremont_media_data:/app/media
  depends_on:
    db:
      condition: service_healthy

services:
  release:
    <<: *django-service
    command: >-
      sh -c "python manage.py migrate --noinput &&
      python manage.py collectstatic --noinput"
    profiles: ["release"]

  web:
    <<: *django-service
    command: >-
      gunicorn config.wsgi:application --bind 0.0.0.0:8000
      --workers ${GUNICORN_WORKERS:-3} --access-logfile - --error-logfile -
    restart: unless-stopped

  nginx:
    image: nginx:1.30.4-alpine3.24
    ports:
      - "${DJANGO_HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - auremont_static_data:/app/staticfiles:ro
      - auremont_media_data:/app/media:ro
    depends_on:
      web:
        condition: service_started
    restart: unless-stopped

  db:
    image: postgres:18.6-alpine3.24
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env.production}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env.production}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
    volumes:
      - auremont_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  auremont_media_data:
  auremont_postgres_data:
  auremont_static_data:
